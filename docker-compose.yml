services:
  app:
    build: .
    ports:
      - "${APP_PORT}:3000"
      - "5555:5555" # prisma studio
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run dev"

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-unit:
    build: .
    container_name: user-service-test-unit
    command: npm run test:unit

  test-integration:
    build: .
    container_name: user-service-test-integration
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_TEST_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run test:integration